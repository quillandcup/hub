display_information:
  name: BillieBot
  description: Community engagement tracking and analytics
  background_color: "#4A154B"
features:
  bot_user:
    display_name: BillieBot
    always_online: true
oauth_config:
  scopes:
    bot:
      # Channel access
      - channels:history
      - channels:read
      - channels:join
      - channels:write.invites
      - groups:history
      - groups:read
      - groups:write.invites
      # DM access
      - im:history
      - mpim:history
      # User data
      - users:read
      - users:read.email
      # Reactions and files
      - reactions:read
      - files:read
      # Feedback widget notifications
      - chat:write
      - files:write
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://hub.quillandcup.com/api/webhooks/slack
    bot_events:
      # Messages
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      # Reactions
      - reaction_added
      - reaction_removed
      # Phase 2 candidates (not yet enabled — uncomment and add live if needed)
      # - message.deleted
      # - message.changed
      # - channel_created
      # - channel_rename
      # - channel_archive
      # - user_change
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
