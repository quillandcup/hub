name: CI

# Gates merges to main with the real test suite, split into two parallel jobs:
# test-unit (fast, fully-mocked pure-logic/component tests, no infra) and test-db
# (integration tests against a real local Supabase stack, not mocks -- see CLAUDE.md's
# note on RLS/SQL functions/bronze-silver-gold -- plus the production build). See
# vitest.config.mts for how tests are split between the two. On push to main, once
# (and only once) both jobs pass, also auto-pushes any pending Supabase migrations
# to production, deploys, and then pushes slack-app-manifest.yml to the Slack app if
# it changed.
#
# Docs-only changes skip all of that. The `changes` job lists the files the change touches
# (scripts/docs-only.ts) and, when every one is documentation, the jobs below are skipped at
# the job level: a skipped job reports as passing, so the required checks are satisfied and
# auto-merge still works. The decision comes from the files, not from the commit message; a
# `[skip ci]` in a message would skip the whole workflow instead, leaving the required checks
# pending (the PR can't merge) and, on main, skipping the deploy with no verification at all.
# On main a skipped run also skips push-migrations and deploy, since there is nothing to ship.
#
# Why the migration push exists: nobody was reliably running `supabase db push`
# after a merge -- new code has 500'd in prod waiting on a table/column that
# was never migrated in. This job makes that step automatic instead of
# memory-dependent.
#
# Ordering (see docs/CI_MIGRATION_ORDERING.md for the full Option A/B writeup):
# Vercel's git-triggered auto-deploy for `main` is disabled in vercel.json
# (git.deploymentEnabled.main: false). Production deploys now only happen via
# the deploy job below, which builds and deploys the commit that just passed
# tests + migrations -- via `vercel pull` / `vercel build --prod` / `vercel
# deploy --prebuilt --prod`, not a remote build triggered by a deploy hook --
# so code that needs a new table/column can never go live before that table/
# column exists, and a failed build/deploy fails the workflow instead of
# reporting green. PR/branch preview deploys are unaffected -- they still go
# through Vercel's git integration as before.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned (not "latest") so the local stack's container image set -- and this
  # cache key, if caching is revisited -- is reproducible across runs.
  SUPABASE_CLI_VERSION: 2.117.0
  # Pinned so `vercel build`/`vercel deploy` behavior in the deploy job below
  # doesn't shift out from under CI on an unannounced CLI release.
  VERCEL_CLI_VERSION: 60.0.0
  # Supabase CLI's well-known local demo keys (see tests/setup.ts) -- fixed,
  # public, and the same for every `supabase start` on every machine. Not
  # secrets. Only valid against the ephemeral local stack this job starts;
  # useless against production.
  LOCAL_SUPABASE_URL: http://127.0.0.1:54321
  LOCAL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  LOCAL_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

jobs:
  # Whether the change is documentation only. Bare Node (24 strips types), so no `npm ci`.
  # workflow_dispatch is a manual redeploy: always the full run. Any failure to work it out
  # (an unfetchable base, an empty diff) answers false, so nothing is skipped by accident.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # A failed fetch leaves FETCH_HEAD at the checked-out commit, so the diff is empty and the
      # answer is false (run everything); it must not fail this job.
      - name: Fetch the comparison commit
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: git fetch --no-tags --depth=1 origin "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}

      - name: Check whether only docs changed
        id: docs
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/docs-only.ts FETCH_HEAD
          fi
        env:
          EVENT: ${{ github.event_name }}

  # The Supabase CLI rejects a migration numbered at or below the latest already on main,
  # which used to surface only in push-migrations, minutes into a main run. This runs in
  # parallel with the tests and fails within seconds: on pull requests against the base
  # branch, on main against the commit before the push (two PRs that each passed alone can
  # still collide). On main it also compares against production's applied list, so a
  # migration that merged below one production already has fails here on every run until
  # it is renumbered. See scripts/check-migration-order.ts.
  check-migrations:
    name: Check migration numbering
    needs: changes
    # !cancelled() keeps these running if `changes` itself fails: only an explicit `true` skips.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0


      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Skipped on workflow_dispatch (manual redeploy, nothing new to compare), but the job
      # still succeeds so push-migrations, which needs it, still runs.
      - name: Fetch the comparison commit
        if: github.event_name != 'workflow_dispatch'
        run: git fetch --no-tags --depth=1 origin "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}

      - name: Check migration numbering
        if: github.event_name != 'workflow_dispatch'
        run: pnpm check:migrations FETCH_HEAD

      # Only on main (and manual redeploys): pull request runs don't get the production
      # credentials.
      - uses: supabase/setup-cli@v1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check against production's applied migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list --linked > "$RUNNER_TEMP/migration-list.json"
          pnpm check:migrations --applied "$RUNNER_TEMP/migration-list.json"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

  test-unit:
    name: Test (unit)
    needs: changes
    # !cancelled() keeps these running if `changes` itself fails: only an explicit `true` skips.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0


      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Next.js 16 removed linting from `next build` entirely (it used to run
      # as part of the "Production build" step in test-db below, gated by
      # next.config.ts's now-removed `eslint.ignoreDuringBuilds` option), so
      # this is now the only thing that lints the codebase. Placed in the
      # fast unit job (no Supabase/Docker needed) for quick feedback.
      - name: Run lint
        run: pnpm lint

      # This bucket is pure-logic/component tests -- every dependency is mocked
      # (vi.mock / vi.fn / stubbed global.fetch) or the test is pure functions in,
      # assertions out. No Supabase, no app server, no Docker: see vitest.config.mts's
      # "unit" project for exactly which files land here and why.
      # Runs the unit suite once, with v8 coverage. The coverage floors are on the unit and db
      # runs combined, so they are checked by the Coverage report job (scripts/coverage-report.ts).
      - name: Run unit test suite (with coverage)
        run: pnpm test:unit:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit
          retention-days: 14

  test-db:
    name: Test (db) & build
    needs: changes
    # !cancelled() keeps these running if `changes` itself fails: only an explicit `true` skips.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0


      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Boots Postgres + the full bronze/silver/gold schema from
      # supabase/migrations (+ seed.sql), same as local dev. Docker-image
      # caching was investigated (supabase/setup-cli's own `enable-docker-cache`
      # input, and a manual `docker save`/`load` keyed on SUPABASE_CLI_VERSION)
      # but both were dropped -- see the timing note in the PR/commit for why
      # neither one comes out ahead in practice. -x drops containers this repo
      # never touches (no Storage image transforms, no Edge Functions, no
      # Studio/log-explorer UI) to shave a little real startup time instead.
      #
      # SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io forces image pulls there
      # instead of the CLI's default candidate cycling (public.ecr.aws ->
      # ghcr.io -> Docker Hub), which was getting stuck retrying only ghcr.io
      # and hitting sustained "toomanyrequests" -- unrelated to this repo's
      # code, but real enough that it once blocked production deploys for
      # nearly an hour. Must be step-level: setting it at the job/workflow
      # level got silently overridden back to ghcr.io by the time this step
      # ran, for a reason that was never identified. Step-level env has the
      # highest precedence in Actions, so it wins regardless of where that
      # override was coming from.
      #
      # Backgrounded (nohup + disown) so the next step (Production build) can
      # run immediately instead of waiting on this ~80s+ startup -- the build
      # doesn't touch Supabase at all (this app has no generateStaticParams /
      # force-static pages that fetch at build time; everything is
      # dynamically rendered behind auth), so the two are independent and can
      # overlap. GitHub Actions runs each step as a fresh shell on the same
      # VM, and a backgrounded+disowned process from one step keeps running
      # into later steps. The "Wait for local Supabase" step (after the
      # build) blocks until this is actually ready before anything that
      # needs it (app server, tests) proceeds.
      # Authenticated Docker Hub pulls get a much higher rate limit than anonymous ones, which
      # the shared runner IPs keep exhausting ("toomanyrequests" failed the db job three times
      # on 2026-10-09 and blocked the migration push and deploy). continue-on-error because
      # runs without our secrets (Dependabot, forks) must still try anonymously.
      # DOCKERHUB_USERNAME is a GitHub variable, DOCKERHUB_TOKEN a secret; both come from
      # env-vars.config.ts via `pnpm env:sync:github`.
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start local Supabase
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        #
        # The wrapper records `supabase start`'s exit code to
        # /tmp/supabase-start.exit when it finishes, so the wait step below can
        # tell "still starting" apart from "done" and "failed".
        run: |
          nohup sh -c 'supabase start -x imgproxy -x edge-runtime -x studio -x logflare -x vector; echo $? > /tmp/supabase-start.exit' > /tmp/supabase-start.log 2>&1 &
          disown

      # Also serves as the production build check that used to be a separate
      # post-test step -- building once here (and starting the app from it,
      # below) covers both. Runs concurrently with "Start local Supabase"
      # above -- the build only needs the Supabase URL/key env vars present
      # (baked in / read at runtime), not a live database.
      #
      # `pnpm build` (package.json) now runs `next build --turbopack`
      # directly, matching what Vercel's production deploys use -- so this
      # step no longer needs to forward the flag itself.
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}

      # Blocks until the backgrounded "Start local Supabase" step above has
      # actually finished starting up, so the app server / test suite never
      # run against a Supabase that isn't ready yet. Also surfaces the
      # backgrounded step's log on failure instead of silently swallowing it.
      #
      # This used to poll `supabase status`, but that returns success as soon
      # as the containers exist, while `supabase start` is still running. Tests
      # then began before the API gateway on :54321 was listening, and the
      # first test file failed with ECONNREFUSED 127.0.0.1:54321. So this
      # step now waits for `supabase start` itself to exit (via the exit-code
      # file written by the start step), then also waits until the gateway
      # answers REST and Auth requests.
      - name: Wait for local Supabase
        run: |
          for i in $(seq 1 180); do
            [ -f /tmp/supabase-start.exit ] && break
            sleep 2
          done
          if [ ! -f /tmp/supabase-start.exit ]; then
            echo "supabase start did not finish in time"
            cat /tmp/supabase-start.log
            exit 1
          fi
          if [ "$(cat /tmp/supabase-start.exit)" != "0" ]; then
            echo "supabase start failed"
            cat /tmp/supabase-start.log
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -H "apikey: $LOCAL_SUPABASE_SERVICE_ROLE_KEY" "$LOCAL_SUPABASE_URL/rest/v1/" \
              && curl -sf -o /dev/null -H "apikey: $LOCAL_SUPABASE_SERVICE_ROLE_KEY" "$LOCAL_SUPABASE_URL/auth/v1/health"; then
              echo "Supabase is up"
              exit 0
            fi
            sleep 1
          done
          echo "Supabase API gateway did not become reachable in time"
          cat /tmp/supabase-start.log
          supabase status || true
          exit 1

      # Most tests/api/** call route handlers in-process (tests/helpers/api-fetch.ts) so their
      # coverage is counted. Only tests/api/smoke/ goes over HTTP, to the built app started here,
      # to cover Next's own routing, proxy and body parsing. Locally those tests use a server
      # already running on :3000 (TEST_API_BASE_URL overrides).
      - name: Start app server
        run: |
          pnpm start > /tmp/next-server.log 2>&1 &
          echo $! > /tmp/next-server.pid
          ready=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/admin/events 2>/dev/null) || true
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "App server is up (HTTP $code)"
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "App server did not become ready in time"
            cat /tmp/next-server.log
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}

      # API-route tests call the route handlers in-process (tests/helpers/api-fetch.ts), so v8
      # counts them; only the few HTTP smoke tests use the app server above. The coverage job
      # below merges this with the unit run and checks the floors.
      - name: Run db test suite (with coverage)
        run: pnpm test:db:coverage

      - name: Upload db coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-db
          path: coverage/db
          retention-days: 14

      # SQL-level tests (pgTAP) in supabase/tests/database: RLS, SECURITY DEFINER functions,
      # auth hooks -- things only observable as a specific Postgres role. Each file rolls back.
      - name: Run pgTAP test suite
        run: pnpm test:pgtap

      - name: Stop app server
        if: always()
        run: kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  coverage:
    name: Coverage report
    needs: [test-unit, test-db]
    # Skipped (not failed) when a test job fails, since there is nothing to merge. Pull requests
    # only: on main this must not hold up push-migrations and the deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # to update the sticky coverage comment
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the new-lines check diffs against the PR's base branch

      - uses: pnpm/action-setup@v6.1.0


      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage/unit

      - uses: actions/download-artifact@v8
        with:
          name: coverage-db
          path: coverage/db

      # Merges both suites' coverage (an item is covered if either ran it), writes the per-area
      # tables to the job summary and one sticky PR comment, and fails if the PR's new code scores
      # under 80%: the mean of its statements, functions and branches covered, or if lib,
      # components or app/api fall under their combined floors (AREA_FLOORS in
      # scripts/coverage-report.ts). To bypass the new-code check for a PR, add the
      # skip-patch-coverage label and re-run this job: the label is read live below.
      - name: Merge coverage, report, and gate new lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }} # the commit the comment's file links point at
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'skip-patch-coverage'; then
            export PATCH_COVERAGE_SKIP=1
          fi
          pnpm exec tsx scripts/coverage-report.ts --suite unit=coverage/unit --suite db=coverage/db --patch-base "origin/$BASE_REF"

  push-migrations:
    name: Push migrations to production
    needs: [check-migrations, test-unit, test-db]
    # needs: [test-unit, test-db] succeeding already gates this on both test
    # buckets (and the build, which test-db also runs) passing; the event/ref
    # check keeps it off pull_request runs. workflow_dispatch on main is the
    # manual redeploy (`gh workflow run ci.yml --ref main`), e.g. after
    # `pnpm env:sync` changes production env vars.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Push pending migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # supabase/config.toml is the source of truth for the auth/API/storage settings it
      # declares ([remotes.prod] pins production's values where they differ from local).
      # Runs after migrations on purpose: config can point at database objects (e.g. the
      # custom access token hook function), so the SQL must exist first. Any declared
      # setting changed in the dashboard is reset here -- change config.toml instead.
      - name: Push Supabase config
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY secret is empty -- refusing to push config (it would overwrite production's SMTP password)."
            exit 1
          fi
          supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Leaked password protection (HaveIBeenPwned check on sign-up/password change) has no
      # config.toml key as of CLI 2.118.0, so set it through the Management API instead.
      # Idempotent; needs the Pro plan. Drop this once `config push` can declare it.
      - name: Enable leaked password protection
        run: |
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"password_hibp_enabled": true}' \
            -o /dev/null
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

  deploy:
    name: Build and deploy to production
    needs: push-migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Makes GitHub record a deployment for this commit (Environments page, the merged PR,
    # `gh api repos/{owner}/{repo}/deployments?sha=<sha>`), marked success or failure when
    # the job ends. Vercel's git integration is off, so this is the only record.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      # `cache: pnpm` here caches pnpm's store, keyed on pnpm-lock.yaml -- `vercel build`
      # below runs its own install internally (and there is no way to skip it), so this is
      # what speeds it up. No explicit install step needed in this job.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: npm install -g "vercel@$VERCEL_CLI_VERSION"

      # `vercel build` populates/reads the same .next/cache that `next build`
      # does (see Next.js's CI build caching docs), so this is what makes a
      # --prebuilt deploy fast instead of a cold build every push -- it's the
      # local equivalent of the remote build cache the deploy-hook path got
      # for free from Vercel's own infrastructure.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Pulls the linked project's real production env vars/settings (this is
      # what makes vercel.json's git.deploymentEnabled.main:false safe --
      # production only ever ships via this explicit, CI-tested path, never
      # an implicit git-triggered build).
      #
      # VERCEL_TOKEN is read from the env automatically -- deliberately not
      # passed as `--token=`, which would leak it into this runner's process
      # listing (`ps`, etc.) for the life of the command.
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Builds the exact commit that test-unit/test-db/push-migrations just
      # passed -- unlike the old deploy-hook trigger, there's no gap where
      # Vercel might build a different HEAD than the one CI validated.
      - name: Build project artifacts
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Source map upload (next.config.ts). A GitHub secret rather than a Vercel var:
          # `vercel pull` above only gets a "[SENSITIVE]" placeholder for Vercel Secrets.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Uploads the local build output as-is instead of triggering another
      # remote build -- and unlike the old curl to the deploy hook, this step
      # actually fails the job (and the workflow) if the deploy doesn't
      # succeed, rather than reporting green the instant Vercel accepts the
      # webhook.
      - name: Deploy prebuilt artifacts to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # slack-app-manifest.yml is the source of truth for the Slack app (Billie Bot): its
  # description, scopes, slash commands, event subscriptions and request URLs. The push
  # REPLACES the live configuration, so anything changed in the Slack dashboard but not in
  # the manifest is reset here -- change the manifest instead. See docs/SLACK_MANIFEST.md.
  #
  # Runs after deploy on purpose: the manifest points at app routes (the /hub command, the
  # events and interactivity request URLs), so those must be live first.
  #
  # No `cancel-in-progress` on main (see `concurrency` above), so runs queue instead of
  # being killed between rotating the Slack token and saving its replacement.
  #
  # Only pushes when the push to main changed the manifest or the script. Every run spends
  # the stored refresh token, and a run reads its secrets when it's queued: a run queued
  # while an earlier one was rotating gets the old, already-spent token and fails with
  # invalid_refresh_token. Skipping the push when nothing changed makes that collision rare.
  # workflow_dispatch (and a push whose previous commit can't be fetched) always pushes.
  push-slack-manifest:
    name: Push Slack app manifest
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check whether the manifest changed
        id: manifest
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "No previous commit to compare against: pushing the manifest."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- slack-app-manifest.yml scripts/slack-manifest.ts; then
            echo "slack-app-manifest.yml and scripts/slack-manifest.ts are unchanged: skipping the push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}

      - uses: pnpm/action-setup@v6.1.0


      - uses: actions/setup-node@v7
        if: steps.manifest.outputs.changed == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.manifest.outputs.changed == 'true'

      # Calls scripts/slack-manifest.ts directly rather than `pnpm slack:manifest:push`,
      # which wraps it in dotenv for the local .env files.
      - name: Push Slack app manifest
        if: steps.manifest.outputs.changed == 'true'
        run: |
          if [ -z "$SLACK_CONFIG_REFRESH_TOKEN" ] || [ -z "$GH_TOKEN" ] || [ -z "$SLACK_APP_ID" ]; then
            echo "SLACK_CONFIG_REFRESH_TOKEN, GH_TOKEN_SLACK_MANIFEST (secrets) and SLACK_APP_ID (variable) must all be set -- see docs/SLACK_MANIFEST.md."
            exit 1
          fi
          pnpm exec tsx scripts/slack-manifest.ts push
        env:
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
          SLACK_CONFIG_REFRESH_TOKEN: ${{ secrets.SLACK_CONFIG_REFRESH_TOKEN }}
          # A fine-grained token with Secrets write: the job's GITHUB_TOKEN can't set secrets.
          GH_TOKEN: ${{ secrets.GH_TOKEN_SLACK_MANIFEST }}

  # vercel-project-config.yml is the source of truth for the Vercel project settings that
  # vercel.json can't express (today: always-on tracing sampling rules). The push REPLACES
  # those rules, so change the file, not the dashboard. See docs/VERCEL_CONFIG.md.
  #
  # Only runs when the push to main changed the file or the script; a manual run
  # (workflow_dispatch) or a push whose previous commit can't be fetched always applies it.
  push-vercel-config:
    name: Push Vercel project config
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check whether the config changed
        id: config
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "No previous commit to compare against: pushing the config."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- vercel-project-config.yml scripts/vercel-config.ts; then
            echo "vercel-project-config.yml and scripts/vercel-config.ts are unchanged: skipping the push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}

      - uses: pnpm/action-setup@v6.1.0


      - uses: actions/setup-node@v7
        if: steps.config.outputs.changed == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.config.outputs.changed == 'true'

      - name: Push Vercel project config
        if: steps.config.outputs.changed == 'true'
        run: pnpm exec tsx scripts/vercel-config.ts push
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
