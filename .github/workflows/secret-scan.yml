name: Secret scan

# gitleaks over the full git history, because the repository is public: a secret that was ever committed is out,
# even if a later commit removed it. Weekly, and on demand. Informational (the job fails when it finds something,
# but it is not a required check, so it never blocks a merge); the findings are in the job log, which prints the
# rule, file and commit but redacts the secret itself (--redact). Rotate anything it finds first; removing it from
# history is the owner's call (public-repo-hygiene.md). Nothing here uses a secret.
on:
  schedule:
    - cron: "29 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --verbose --exit-code 1
