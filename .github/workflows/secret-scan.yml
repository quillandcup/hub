name: Secret scan

# gitleaks over the full git history, because the repository is public: a secret that was ever committed is out,
# even if a later commit removed it. Weekly, and on demand. The job fails when it finds something and posts to the alerts
# channel (not a required check, so it never blocks a merge); the findings are in the job log, which prints the
# rule, file and commit but redacts the secret itself (--redact). Rotate anything it finds first; removing it from
# history is the owner's call (public-repo-hygiene.md). The only secret is the alerts webhook (SLACK_ALERTS_WEBHOOK_URL), as in audit.yml.
on:
  schedule:
    - cron: "29 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --verbose --exit-code 1

      # Tell the alerts channel when it finds something, same webhook and pattern as audit.yml. Not set (or a fork): nothing is posted.
      - name: Post findings to Slack
        if: failure()
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then echo "SLACK_ALERTS_WEBHOOK_URL is not set; not posting."; exit 0; fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"Secret scan (gitleaks) found a possible committed secret. Rotate it first. Details: $RUN_URL\"}" \
            "$SLACK_ALERTS_WEBHOOK_URL"
