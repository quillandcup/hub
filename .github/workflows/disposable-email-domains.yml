name: Refresh temp-mail domain list

# Weekly: re-fetches the public blocklist of temporary-mail domains (disposable-email-domains/disposable-email-domains,
# CC0) into src/lib/disposable-email-domains.generated.ts and, when it changed, opens a PR. The PR is a normal one: the
# required checks run on it and auto-merge (auto-merge.yml) lands it on green, so a refresh needs nobody unless
# something fails. The script refuses a list that is suspiciously short or that names a mainstream provider (Gmail,
# Outlook, ...), so a bad upstream edit fails this job instead of reaching members.
#
# Opens the PR with GH_TOKEN_AUTO_MERGE (the personal token auto-merge.yml uses), not the built-in GITHUB_TOKEN:
# a PR opened by GITHUB_TOKEN does not trigger the pull_request workflows, so its required checks would never run
# and it could not merge. Rotate it per docs/runbooks/SECRET_ROTATION.md. At most one refresh PR is open at a time.
on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh temp-mail domain list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN_AUTO_MERGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_TOKEN_AUTO_MERGE }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: "package.json"

      - run: pnpm install --frozen-lockfile

      - name: Skip when a refresh PR is already open
        id: open
        run: |
          count=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("chore/disposable-email-domains-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Fetch the list
        if: steps.open.outputs.count == '0'
        run: pnpm disposable-domains:update

      - name: Open a PR when it changed
        if: steps.open.outputs.count == '0'
        run: |
          if git diff --quiet -- src/lib/disposable-email-domains.generated.ts; then echo "The list is unchanged."; exit 0; fi
          branch="chore/disposable-email-domains-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/lib/disposable-email-domains.generated.ts
          git commit -m "Refresh the temp-mail domain list"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh the temp-mail domain list" \
            --body "Weekly refresh of \`src/lib/disposable-email-domains.generated.ts\` from the public disposable-email-domains list (CC0), by \`.github/workflows/disposable-email-domains.yml\`. One domain per line, so the diff shows exactly which were added or removed. Auto-merges when the required checks pass."

      # Same channel and secret as audit.yml: a failed refresh (including the script refusing a bad list) is not only a red run.
      - name: Post failure to Slack
        if: failure()
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then echo "SLACK_ALERTS_WEBHOOK_URL is not set; not posting."; exit 0; fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"The weekly temp-mail domain list refresh failed. Details: $RUN_URL\"}" \
            "$SLACK_ALERTS_WEBHOOK_URL"
