name: Dependency audit

# Known advisories in the production dependencies (`pnpm audit --prod --audit-level=high`). Not a required check
# and never blocks a merge. Scheduled and manual runs fail on an advisory (and post to the alerts channel); a pull request
# that touches the lockfile only reports (step-level continue-on-error), so an advisory with no patched version, or one in
# a transitive package we can't bump, never stops an unrelated PR. The weekly schedule is how it gets noticed even when no
# PR touches the lockfile. Dependabot (weekly) is what raises the fix PRs; open findings are listed in docs/TODO.md,
# "Threat model follow-ups". The only secret is the alerts webhook (SLACK_ALERTS_WEBHOOK_URL).
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: "package.json"

      # Step-level continue-on-error on pull requests only: the job (and its check) stays green there, because a job-level one still shows
      # a red check on the PR. The findings are in this step's log, which shows a failed step.
      - name: Audit
        id: audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm audit --prod --audit-level=high

      # Tell #hub-alerts when the audit finds something, so a finding is not only a line in a log. The secret is a
      # Slack incoming-webhook URL for that one channel: it can only post there. It belongs to Billie Bot's installation
      # (the incoming-webhook scope in config/slack-app-manifest.yml, docs/infrastructure/SLACK_MANIFEST.md). Not set (or a fork): the step does nothing.
      - name: Post findings to Slack
        if: always() && steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then echo "SLACK_ALERTS_WEBHOOK_URL is not set; not posting."; exit 0; fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"Dependency audit found advisories in production dependencies. Details: $RUN_URL\"}" \
            "$SLACK_ALERTS_WEBHOOK_URL"
