name: Dependency audit

# Known advisories in the production dependencies (`pnpm audit --prod --audit-level=high`). Not a required check
# and never blocks a merge: an advisory with no patched version, or one in a transitive package we can't bump, would
# stop every PR for something unrelated to it. The step is informational (continue-on-error), so the check stays green
# and a finding shows in the step's log, and the weekly schedule is how it gets noticed even when no PR touches the lockfile.
# Dependabot (weekly) is what raises the fix PRs; the open findings are listed in docs/TODO.md,
# "Threat model follow-ups". Nothing here uses a secret.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # Step-level continue-on-error: the job (and its check) stays green, because a job-level one still shows
      # a red check on the PR. The findings are in this step's log, which shows a failed step.
      - name: Audit
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      # Tell #hub-alerts when the audit finds something, so a finding is not only a line in a log. The secret is a
      # Slack incoming-webhook URL for that one channel: it can only post there. It belongs to Billie Bot's installation
      # (the incoming-webhook scope in config/slack-app-manifest.yml, docs/SLACK_MANIFEST.md). Not set (or a fork): the step does nothing.
      - name: Post findings to Slack
        if: steps.audit.outcome == 'failure'
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then echo "SLACK_ALERTS_WEBHOOK_URL is not set; not posting."; exit 0; fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"Dependency audit found advisories in production dependencies. Details: $RUN_URL\"}" \
            "$SLACK_ALERTS_WEBHOOK_URL"
