name: Main red alert

# Announces a failed CI run on main with one GitHub issue, labelled `main-red`, so the repo's watchers
# are notified instead of someone finding out by looking: a failed main run means the merged commit
# was not promoted (no migrations, no deploy). The issue closes itself, with a comment, when a later
# run on main passes (and its unit tests really ran: a docs-only run proves nothing). A cancelled run
# is ignored: `main` runs one at a time and a waiting run is cancelled by a newer merge.
#
# scripts/main-red-alert.ts does the work, with the workflow's own token (issues: write, actions:
# read): no new secret. It checks out main itself (workflow_run workflows always run the default
# branch's file), never the run's code. The issue holds job names, a commit sha and a link, no logs.
# Runs of CI on a fork's pull request that happen to come from a branch named main are skipped: only
# `push` and `workflow_dispatch` runs of this repository count.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: main-red-alert
  cancel-in-progress: false

jobs:
  alert:
    name: Open or close the main-red issue
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success') &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read # check out main
      actions: read # the failed jobs of the run
      issues: write # open, update and close the issue and create its label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: "package.json"

      - name: Open, update or close the issue
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/main-red-alert.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
