name: ZAP baseline

# OWASP ZAP's baseline scan against production: it crawls the public pages for a couple of minutes and only
# watches the responses (headers, cookies, leaked info). It sends no attack payloads and signs in as nobody, so
# it is safe to point at the live site. There are no preview deploys to aim it at. An authenticated or active scan
# does NOT belong here: run those against a local or demo stack. Weekly, informational (not a required check, no
# GitHub issue is opened); the HTML report is the run's artifact. The target is `appUrl` from app.config.ts.
# Nothing here uses a secret.
on:
  schedule:
    - cron: "11 7 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline (production, passive)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Read the production URL from app.config.ts
        id: target
        run: |
          url=$(node --no-warnings --input-type=module -e "console.log((await import('./app.config.ts')).default.appUrl)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
