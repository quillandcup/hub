name: ZAP baseline

# OWASP ZAP's baseline scan against production: it crawls the public pages for a couple of minutes and only
# watches the responses (headers, cookies, leaked info). It sends no attack payloads and signs in as nobody, so
# it is safe to point at the live site. There are no preview deploys to aim it at. An authenticated or active scan
# does NOT belong here: run those against a local or demo stack. Weekly, not a required check (it fails and posts to the alerts
# channel on findings; no GitHub issue is opened); the HTML report is the run's artifact. The target is `appUrl` from config/app.ts.
# The only secret is the alerts webhook (SLACK_ALERTS_WEBHOOK_URL), as in audit.yml.
on:
  schedule:
    - cron: "11 7 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline (production, passive)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Read the production URL from config/app.ts
        id: target
        run: |
          url=$(node --no-warnings --input-type=module -e "console.log((await import('./config/app.ts')).default.appUrl)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: true
          # -I: warnings do not fail the run, only FAIL-level alerts do. The first run had 10 warnings and 0 failures,
          # and most are informational (a report-only CSP, cache headers), so alerting on them would be noise.
          cmd_options: "-I"
          artifact_name: zap-baseline-report

      # fail_action is on and -I ignores warnings, so a FAIL-level alert turns the step red; tell the alerts channel (same webhook and pattern as audit.yml).
      - name: Post findings to Slack
        if: failure()
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then echo "SLACK_ALERTS_WEBHOOK_URL is not set; not posting."; exit 0; fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"ZAP baseline scan of production reported findings. The report is an artifact on the run: $RUN_URL\"}" \
            "$SLACK_ALERTS_WEBHOOK_URL"
