name: Checkly CI/CD

# Only touches Checkly's own monitoring config -- unrelated app PRs/pushes
# shouldn't trigger a check test/deploy.
on:
  pull_request:
    paths:
      - "__checks__/**"
      - "checkly.config.ts"
      - "lib/cron-heartbeats.ts"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/checkly.yml"
  push:
    branches: [main]
    paths:
      - "__checks__/**"
      - "checkly.config.ts"
      - "lib/cron-heartbeats.ts"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/checkly.yml"
  # Manual deploy, e.g. to check a rotated CHECKLY_API_KEY: `gh workflow run checkly.yml --ref main`.
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for both jobs. Neither job needs write access:
# checkly/checkly-action@v1 talks to the Checkly API directly with
# CHECKLY_API_KEY, and its `reporting: auto` "detached GitHub Check" mode is
# posted by Checkly's own GitHub App installation -- a credential entirely
# separate from this workflow's GITHUB_TOKEN. Confirmed by reading the
# action's scripts/run.sh and the checkly-cli GitHub reporter source: neither
# references GITHUB_TOKEN, and the non-detached fallback only writes
# GITHUB_STEP_SUMMARY locally. So contents: read (for actions/checkout) is
# sufficient for both jobs; no checks:write or statuses:write needed.
permissions:
  contents: read

jobs:
  checkly-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: checkly/checkly-action@v1
        with:
          command: test
          install-command: pnpm install --frozen-lockfile
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }} # read by __checks__/config.ts

  checkly-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # One deploy at a time. `checkly deploy` replaces the whole project, so two overlapping deploys
    # from back-to-back merges can finish in the wrong order and leave the older commit's monitors
    # live, deleting any the newer commit added (a new heartbeat vanished this way). Queued runs wait
    # their turn rather than cancelling the one in flight; GitHub drops all but the newest queued run,
    # which is the one that has everything.
    concurrency:
      group: checkly-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      # `checkly deploy` prints every heartbeat's ping URL, and anyone holding one can mark that job
      # healthy. The logs are public, so register each URL for masking before the deploy runs. The
      # values are GitHub secrets (env-vars.config.ts), already masked by GitHub; the explicit lines
      # make that visible and survive a switch to a plain variable. A new heartbeat needs its line
      # here (tests/lib/workflow-heartbeat-masking.test.ts checks), and its first deploy prints the
      # URL before it can be a secret: copy it into .env.prod and sync it to GitHub too.
      - name: Mask heartbeat ping URLs
        run: |
          [ -z "$CHECKLY_HEARTBEAT_RECONCILE_CALENDAR" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_RECONCILE_CALENDAR"
          [ -z "$CHECKLY_HEARTBEAT_RECONCILE_ZOOM" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_RECONCILE_ZOOM"
          [ -z "$CHECKLY_HEARTBEAT_RECONCILE_SLACK" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_RECONCILE_SLACK"
          [ -z "$CHECKLY_HEARTBEAT_RECONCILE_MEMBERS" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_RECONCILE_MEMBERS"
          [ -z "$CHECKLY_HEARTBEAT_RECONCILE_LOGINS" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_RECONCILE_LOGINS"
          [ -z "$CHECKLY_HEARTBEAT_PRE_PRICKLE_NUDGES" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_PRE_PRICKLE_NUDGES"
          [ -z "$CHECKLY_HEARTBEAT_MEMBER_REMINDERS" ] || echo "::add-mask::$CHECKLY_HEARTBEAT_MEMBER_REMINDERS"
        env:
          CHECKLY_HEARTBEAT_RECONCILE_CALENDAR: ${{ secrets.CHECKLY_HEARTBEAT_RECONCILE_CALENDAR }}
          CHECKLY_HEARTBEAT_RECONCILE_ZOOM: ${{ secrets.CHECKLY_HEARTBEAT_RECONCILE_ZOOM }}
          CHECKLY_HEARTBEAT_RECONCILE_SLACK: ${{ secrets.CHECKLY_HEARTBEAT_RECONCILE_SLACK }}
          CHECKLY_HEARTBEAT_RECONCILE_MEMBERS: ${{ secrets.CHECKLY_HEARTBEAT_RECONCILE_MEMBERS }}
          CHECKLY_HEARTBEAT_RECONCILE_LOGINS: ${{ secrets.CHECKLY_HEARTBEAT_RECONCILE_LOGINS }}
          CHECKLY_HEARTBEAT_PRE_PRICKLE_NUDGES: ${{ secrets.CHECKLY_HEARTBEAT_PRE_PRICKLE_NUDGES }}
          CHECKLY_HEARTBEAT_MEMBER_REMINDERS: ${{ secrets.CHECKLY_HEARTBEAT_MEMBER_REMINDERS }}
      - run: pnpm exec checkly deploy --force
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }} # read by __checks__/config.ts
