name: OpenSSF Scorecard

# Grades the repository's own supply-chain habits (pinned actions, token permissions, branch protection, review,
# dependency update tooling, security policy). Informational, like audit.yml: not a required check and it never
# blocks a merge. Findings land in the Security tab (code scanning) and the score is published to the OpenSSF
# API, which only works for a public repository. Nothing here uses a secret.
on:
  schedule:
    - cron: "41 6 * * 2"
  push:
    branches: [main]
    paths:
      - .github/**
      - config/github-repo-config.yml
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
          category: scorecard
