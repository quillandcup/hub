name: Auto-merge

# Turns on GitHub's native auto-merge for every new pull request, so it merges
# by itself once the required checks on main (Test (unit), Test (db) & build,
# Coverage report; see github-repo-config.yml) pass. It never merges anything
# early: with a required check failing or pending, the PR just waits.
#
# Runs when the PR is opened, reopened or marked ready for review, and on every push
# (synchronize) as a backstop: GitHub doesn't run pull_request workflows on a PR that has
# merge conflicts, so one opened while conflicting never got auto-merge, and the push that
# fixed the conflict is the first chance to enable it. A push never turns it back on after
# a person turned it off: the PR's timeline records that as auto_merge_disabled, and we
# stop there. To keep a PR from merging: open it as a draft, or click "Disable auto-merge".
#
# Enables it with GH_TOKEN_AUTO_MERGE (a fine-grained personal token), not the built-in
# GITHUB_TOKEN: GitHub attributes an auto-merge to whoever enabled it, and a merge made
# by GITHUB_TOKEN doesn't trigger the push CI run on main (no migrations, deploy or
# Slack manifest push). Rotate it before it expires, see docs/SECRET_ROTATION.md.
#
# Skipped for drafts and for forks (their GITHUB_TOKEN can't write). Dependabot PRs get
# the stricter rule: only patch/minor version bumps are enabled, majors are far more likely
# to carry breaking changes and always need a human. That is a deliberate safety choice, not
# something to make configurable. Dependabot runs read Dependabot secrets, not Actions
# secrets, so `pnpm env:sync:github` also writes GH_TOKEN_AUTO_MERGE as a Dependabot secret
# (env-vars.config.ts); without it those PRs fall back to GITHUB_TOKEN, whose merges don't
# trigger the push CI run on main. Needs the repo-level "Allow auto-merge" setting
# (Settings -> General -> Pull Requests); without it `gh pr merge --auto` fails.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge
        if: |
          github.actor != 'dependabot[bot]' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          if [ "$EVENT_ACTION" = "synchronize" ]; then
            opted_out=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/timeline" --jq '.[] | select(.event == "auto_merge_disabled") | .event')
            if [ -n "$opted_out" ]; then
              echo "Auto-merge was turned off on this PR; leaving it off."
              exit 0
            fi
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_AUTO_MERGE || secrets.GITHUB_TOKEN }}
