name: OSV scan

# Known vulnerabilities in the lockfile from the OSV database, which covers more than the npm advisories that
# `pnpm audit` (audit.yml) reads. Results go to the Security tab. Informational: not a required check, and the
# step does not fail the job (fail-on-vuln is off), for the same reason audit.yml doesn't block: an advisory with
# no patched version would stop every PR. Dependabot raises the fix PRs. Nothing here uses a secret.
on:
  schedule:
    - cron: "53 6 * * 1"
  pull_request:
    paths:
      - pnpm-lock.yaml
      - .github/workflows/osv-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV-Scanner
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      fail-on-vuln: false
