name: OSV scan

# Known vulnerabilities in the lockfile from the OSV database, which covers more than the npm advisories that
# `pnpm audit` (audit.yml) reads. Results go to the Security tab. Not a required check. The scheduled and manual runs fail on a
# vulnerability and post to the alerts channel; a pull request only reports (fail-on-vuln is off there), for the same reason audit.yml doesn't block: an advisory with
# no patched version would stop every PR. A finding with no fix that is accepted on purpose is listed in config/osv-scanner.toml,
# with a reason and an expiry date, and does not fail the run until it expires. Dependabot raises the fix PRs.
# The only secret is the alerts webhook (SLACK_ALERTS_WEBHOOK_URL), as in audit.yml.
on:
  schedule:
    - cron: "53 6 * * 1"
  pull_request:
    paths:
      - pnpm-lock.yaml
      - config/osv-scanner.toml
      - .github/workflows/osv-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV-Scanner
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --config=config/osv-scanner.toml
      fail-on-vuln: ${{ github.event_name != 'pull_request' }}

  # Scheduled and manual runs fail on a vulnerability (fail-on-vuln above); pull requests only report, so a lockfile
  # change is never blocked by an advisory that has no fix. Tell the alerts channel, same pattern as audit.yml.
  notify:
    name: Post findings to Slack
    needs: osv
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then echo "SLACK_ALERTS_WEBHOOK_URL is not set; not posting."; exit 0; fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"OSV-Scanner found vulnerable dependencies in the lockfile. Details: $RUN_URL\"}" \
            "$SLACK_ALERTS_WEBHOOK_URL"
