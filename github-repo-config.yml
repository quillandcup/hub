# GitHub repository settings that live in git, applied by scripts/github-config.ts
# (`npm run github:config:diff` previews, `npm run github:config:push` applies; needs repo admin
# through `gh auth login`). Edit this file, not the Settings page: a push makes the live
# ruleset match it.
#
# One ruleset on the default branch. Required checks are the job names in
# .github/workflows/ci.yml; a check skipped by its `if:` (Coverage report on a push to main)
# counts as passing, so only pull requests wait on it. Nothing can be pushed to main directly,
# admins included: changes go through a pull request, where the checks and the coverage gate run
# (the Coverage report job is PR-only). An admin can still override a failing PR with "Merge
# without waiting for requirements".
rulesets:
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    bypass_actors:
      # actor_id 5 is the built-in Repository admin role.
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: pull_request
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            # integration_id 15368 is the GitHub Actions app: only a workflow job can satisfy
            # these, not another app or token posting a status of the same name.
            - context: Test (unit)
              integration_id: 15368
            - context: Test (db) & build
              integration_id: 15368
            - context: Coverage report
              integration_id: 15368
