# GitHub repository settings that live in git, applied by scripts/github-config.ts
# (`pnpm github:config:diff` previews, `pnpm github:config:push` applies; needs repo admin
# through `gh auth login`). Edit this file, not the Settings page: a push makes the live
# ruleset match it.
#
# Repository settings: allow_auto_merge lets GitHub merge a PR by itself once its required checks
# pass, which .github/workflows/auto-merge.yml turns on for every new PR (Dependabot's only
# for patch/minor bumps); it does nothing while this is off.
#
# delete_branch_on_merge removes a PR's branch from the remote when it merges (auto-merge
# included), so merged branches don't pile up and nobody pushes follow-ups to a dead one.
# Local copies are separate: `pnpm branches:prune` (scripts/prune-branches.ts) cleans them.
settings:
  allow_auto_merge: true
  delete_branch_on_merge: true

# Default permission of a workflow's GITHUB_TOKEN (Settings, Actions, General), applied with
# PUT /repos/{repo}/actions/permissions/workflow. `read` means a workflow gets write access only
# where it declares `permissions:` itself (every workflow here does). can_approve_pull_request_reviews
# is false: no workflow approves a pull request or opens one with the built-in token (auto-merge.yml and
# the disposable-email-domains refresh use their own personal tokens), and with it on a compromised workflow
# could approve its own pull request the day approvals are required. A new workflow that needs to open a
# pull request with GITHUB_TOKEN has to turn it back on here.
workflow_permissions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

# One ruleset on the default branch. Required checks are the job names in
# .github/workflows/ci.yml; a check skipped by its `if:` (Coverage report on a push to main)
# counts as passing, so only pull requests wait on it; that is also how a docs-only change gets
# through (ci.yml skips the test jobs, scripts/docs-only.ts decides). Don't use `[skip ci]` for
# that: it skips the whole workflow and leaves these checks pending forever. Nothing can be pushed to main directly,
# admins included: changes go through a pull request, where the checks and the coverage gate run
# (the Coverage report job is PR-only). The rules apply to administrators too (no bypass actors):
# there is no "Merge without waiting for requirements". If a check itself is broken, fix or
# temporarily edit this file's ruleset through a reviewed change, or edit the ruleset in Settings
# as a last resort and put it back with `pnpm github:config:push`.
rulesets:
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    bypass_actors: []
    rules:
      - type: deletion
      - type: non_fast_forward
      # No approvals required (0), only that every review thread is resolved, bots' included
      # (GitHub's security agent, other review agents): auto-merge waits until they are.
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            # integration_id 15368 is the GitHub Actions app: only a workflow job can satisfy
            # these, not another app or token posting a status of the same name.
            - context: Test (unit)
              integration_id: 15368
            - context: Test (db) & build
              integration_id: 15368
            - context: Coverage report
              integration_id: 15368
            - context: Check migrations
              integration_id: 15368
            # Fails a pull request on NEW identical functions or duplicated branches, and on a new unused
            # file or dependency (knip-baseline.json). It runs on every pull request, with no path filter, so
            # it always reports. Trial run 2026-11-21: it failed as intended on a throwaway PR.
            - context: Code quality gate
              integration_id: 15368
            # The code scanning result (new alerts in the PR's changes), posted by the GitHub
            # Advanced Security app (57789), not an Actions job: the Analyze jobs only run the scan.
            - context: CodeQL
              integration_id: 57789
            # Fails a pull request that INTRODUCES a known vulnerability in pnpm-lock.yaml (OSV-Scanner diff
            # against the base branch, .github/workflows/osv-diff.yml), so an advisory already on main, even one with
            # no fix, never stops an unrelated PR. No path filter, so it always reports. Trial 2026-11-23: it passed
            # on a PR that touched no dependencies and failed on a throwaway PR that added lodash 4.17.20.
            - context: OSV diff / osv-scan
              integration_id: 15368
